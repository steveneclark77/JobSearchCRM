spring.datasource.url=${DATABASE_URL:jdbc:h2:file:./data/jobcrm;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${DATABASE_USER:sa}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
server.address=${BIND_ADDRESS:127.0.0.1}
server.port=${PORT:8080}
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict
server.servlet.session.cookie.secure=${COOKIE_SECURE:false}
server.servlet.session.timeout=8h
server.error.include-message=never
spring.jackson.deserialization.fail-on-unknown-properties=true
spring.mail.host=${SMTP_HOST:localhost}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:true}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
crm.mail.enabled=${MAIL_ENABLED:false}
crm.mail.from=${MAIL_FROM:}
crm.backup-dir=${BACKUP_DIR:./data/backups}
spring.servlet.multipart.max-file-size=10MB
